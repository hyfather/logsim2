    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - teams-chat request received
          - teams-chat processed event
          - teams-chat returned response
    templates:
      - id: info
        template: '{{timestamp}} teams-chat [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} teams-chat [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: id-ueba-events
    name: id-ueba
    description: Generic event log for id-ueba
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - id-ueba request received
          - id-ueba processed event
          - id-ueba returned response
    templates:
      - id: info
        template: '{{timestamp}} id-ueba [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} id-ueba [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: siem-collector-events
    name: siem-collector
    description: Generic event log for siem-collector
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
