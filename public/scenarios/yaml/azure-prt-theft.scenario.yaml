name: Azure AD Pass-the-PRT
description: >-
  An infostealer pulls the Primary Refresh Token cookie + transport key from a corp laptop. The attacker replays them
  from their own machine, resolves a valid access token for graph.microsoft.com without prompting MFA, and starts
  pulling email + Teams chat history.
duration: 1620
tick_interval_ms: 1000
nodes:
  - type: vpc
    name: corp-identity
    provider: aws
    region: us-east-1
    cidr_block: 10.0.0.0/16
  - type: subnet
    name: identity-edge
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: saas-bridge
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: audit-store
    cidr_block: 10.0.1.0/24
  - type: virtual_server
    name: entra-token-endpoint-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: identity-edge
  - type: virtual_server
    name: ms-graph-api-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: saas-bridge
  - type: virtual_server
    name: exchange-online-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: saas-bridge
  - type: virtual_server
    name: teams-chat-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: saas-bridge
  - type: virtual_server
    name: id-ueba-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: saas-bridge
  - type: virtual_server
    name: siem-collector-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: audit-store
services:
  - type: nginx
    name: entra-token-endpoint
    host: entra-token-endpoint-host
    generator:
      type: nginx
      port: 80
      log_format: combined
      traffic_rate: 50
    timeline:
      - from: 0
        to: 420
        state: healthy
      - from: 420
        to: 1080
        state: compromised
        note: PRT replayed
      - from: 1080
        to: 1320
        state: recovering
      - from: 1320
        to: 1620
        state: healthy
  - type: custom
    name: ms-graph-api
    host: ms-graph-api-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 60
      error_rate: 0.005
      custom_type: ms-graph-api-events
    timeline:
      - from: 0
        to: 600
        state: healthy
      - from: 600
        to: 1080
        state: under_attack
        note: anomalous graph reads
      - from: 1080
        to: 1620
        state: healthy
  - type: custom
    name: exchange-online
    host: exchange-online-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 30
      error_rate: 0.005
      custom_type: exchange-online-events
    timeline:
      - from: 0
        to: 600
        state: healthy
      - from: 600
        to: 1080
        state: compromised
        note: mailbox bulk read
      - from: 1080
        to: 1620
        state: healthy
  - type: custom
    name: teams-chat
    host: teams-chat-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 25
      error_rate: 0.005
      custom_type: teams-chat-events
  - type: custom
    name: id-ueba
    host: id-ueba-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 12
      error_rate: 0.005
      custom_type: id-ueba-events
  - type: custom
    name: siem-collector
    host: siem-collector-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 22
      error_rate: 0.001
      custom_type: siem-collector-events
connections:
  - source: entra-token-endpoint
    target: ms-graph-api
    protocol: https
    port: 443
  - source: ms-graph-api
    target: exchange-online
    protocol: https
    port: 443
  - source: ms-graph-api
    target: teams-chat
    protocol: https
    port: 443
  - source: ms-graph-api
    target: id-ueba
    protocol: https
    port: 443
  - source: id-ueba
    target: siem-collector
    protocol: tcp
    port: 9200
custom_types:
  - id: ms-graph-api-events
    name: ms-graph-api
    description: Generic event log for ms-graph-api
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - ms-graph-api request received
          - ms-graph-api processed event
          - ms-graph-api returned response
    templates:
      - id: info
        template: '{{timestamp}} ms-graph-api [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} ms-graph-api [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: exchange-online-events
    name: exchange-online
    description: Generic event log for exchange-online
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
