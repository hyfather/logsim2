name: Stale Cross-Account Trust Abused
description: >-
  Vendor X went out of business in 2023, but the IAM role 'vendor-x-replication' in the prod account still trusts
  arn:aws:iam::4112*****:root. Someone bought their AWS account at auction and rediscovered the trust. Now they
  sts:AssumeRole into prod and start enumerating.
duration: 1500
tick_interval_ms: 1000
nodes:
  - type: vpc
    name: control-plane-mirror
    provider: aws
    region: us-east-1
    cidr_block: 10.0.0.0/16
  - type: subnet
    name: iam-edge
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: control-plane-app
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: audit-store
    cidr_block: 10.0.1.0/24
  - type: virtual_server
    name: aws-iam-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: iam-edge
  - type: virtual_server
    name: aws-s3-control-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: control-plane-app
  - type: virtual_server
    name: aws-ec2-control-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: control-plane-app
  - type: virtual_server
    name: cloudtrail-firehose-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: audit-store
  - type: virtual_server
    name: siem-collector-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: audit-store
services:
  - type: custom
    name: aws-iam
    host: aws-iam-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 5
      custom_type: aws-iam-events
    timeline:
      - from: 0
        to: 240
        state: healthy
      - from: 240
        to: 720
        state: under_attack
        note: stale trust abused
      - from: 720
        to: 960
        state: recovering
      - from: 960
        to: 1500
        state: healthy
  - type: custom
    name: aws-s3-control
    host: aws-s3-control-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 12
      error_rate: 0.005
      custom_type: aws-s3-control-events
    timeline:
      - from: 0
        to: 360
        state: healthy
      - from: 360
        to: 720
        state: under_attack
        note: anonymous-ish enumeration via assumed role
      - from: 720
        to: 1500
        state: healthy
  - type: custom
    name: aws-ec2-control
    host: aws-ec2-control-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 15
      error_rate: 0.005
      custom_type: aws-ec2-control-events
    timeline:
      - from: 0
        to: 360
        state: healthy
      - from: 360
        to: 720
        state: under_attack
      - from: 720
        to: 1500
        state: healthy
  - type: custom
    name: cloudtrail-firehose
    host: cloudtrail-firehose-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 20
      error_rate: 0.001
      custom_type: cloudtrail-firehose-events
  - type: custom
    name: siem-collector
    host: siem-collector-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 16
      error_rate: 0.001
      custom_type: siem-collector-events
connections:
  - source: aws-iam
    target: aws-s3-control
    protocol: https
    port: 443
  - source: aws-iam
    target: aws-ec2-control
    protocol: https
    port: 443
  - source: aws-s3-control
    target: cloudtrail-firehose
    protocol: https
    port: 443
  - source: aws-ec2-control
    target: cloudtrail-firehose
    protocol: https
    port: 443
  - source: cloudtrail-firehose
    target: siem-collector
    protocol: tcp
    port: 9200
custom_types:
  - id: aws-iam-events
    name: aws-iam
    description: Generic event log for aws-iam
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - aws-iam request received
          - aws-iam processed event
          - aws-iam returned response
    templates:
      - id: info
        template: '{{timestamp}} aws-iam [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} aws-iam [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: aws-s3-control-events
    name: aws-s3-control
    description: Generic event log for aws-s3-control
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - aws-s3-control request received
          - aws-s3-control processed event
          - aws-s3-control returned response
    templates:
      - id: info
        template: '{{timestamp}} aws-s3-control [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} aws-s3-control [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: aws-ec2-control-events
    name: aws-ec2-control
    description: Generic event log for aws-ec2-control
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - aws-ec2-control request received
          - aws-ec2-control processed event
          - aws-ec2-control returned response
    templates:
      - id: info
        template: '{{timestamp}} aws-ec2-control [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} aws-ec2-control [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: cloudtrail-firehose-events
    name: cloudtrail-firehose
    description: Generic event log for cloudtrail-firehose
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - cloudtrail-firehose request received
          - cloudtrail-firehose processed event
          - cloudtrail-firehose returned response
    templates:
      - id: info
        template: '{{timestamp}} cloudtrail-firehose [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} cloudtrail-firehose [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: siem-collector-events
    name: siem-collector
    description: Generic event log for siem-collector
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - siem-collector request received
          - siem-collector processed event
          - siem-collector returned response
    templates:
      - id: info
        template: '{{timestamp}} siem-collector [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} siem-collector [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
