name: Illicit OAuth Consent Grant
description: >-
  Targeted phishing email asks finance staff to review a 'Quarterly Spend Reviewer' app. The consent screen requests
  Mail.Read + Files.Read.All + offline_access. Three users click. Within minutes the attacker is pulling the inbox of
  two of them via the Microsoft Graph API.
duration: 1620
tick_interval_ms: 1000
nodes:
  - type: vpc
    name: corp-identity
    provider: aws
    region: us-east-1
    cidr_block: 10.0.0.0/16
  - type: subnet
    name: identity-edge
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: saas-bridge
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: audit-store
    cidr_block: 10.0.1.0/24
  - type: virtual_server
    name: entra-oauth-broker-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: identity-edge
  - type: virtual_server
    name: ms-graph-egress-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: saas-bridge
  - type: virtual_server
    name: exchange-online-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: saas-bridge
  - type: virtual_server
    name: audit-events-db-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: audit-store
  - type: virtual_server
    name: siem-collector-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: audit-store
services:
  - type: nginx
    name: entra-oauth-broker
    host: entra-oauth-broker-host
    generator:
      type: nginx
      port: 80
      log_format: combined
      traffic_rate: 50
    timeline:
      - from: 0
        to: 360
        state: healthy
      - from: 360
        to: 600
        state: under_attack
        note: rogue consent grants
      - from: 600
        to: 1020
        state: compromised
        note: tokens minted, refresh in use
      - from: 1020
        to: 1260
        state: recovering
        note: tokens revoked
      - from: 1260
        to: 1620
        state: healthy
  - type: custom
    name: ms-graph-egress
    description: Outbound graph.microsoft.com proxy with audit.
    host: ms-graph-egress-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 80
      error_rate: 0.003
      custom_type: ms-graph-egress-events
    timeline:
      - from: 0
        to: 600
        state: healthy
      - from: 600
        to: 1020
        state: under_attack
        note: anomalous Graph pulls
      - from: 1020
        to: 1260
        state: recovering
      - from: 1260
        to: 1620
        state: healthy
  - type: custom
    name: exchange-online
    description: Logical service representing M365 mailbox tenancy.
    host: exchange-online-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 60
      error_rate: 0.002
      custom_type: exchange-online-events
    timeline:
      - from: 0
        to: 600
        state: healthy
      - from: 600
        to: 1020
        state: compromised
        note: bulk message read
      - from: 1020
        to: 1620
        state: healthy
  - type: postgres
    name: audit-events-db
    host: audit-events-db-host
    generator:
      type: postgres
      port: 5432
      slow_query_threshold: 1000
      traffic_rate: 20
      error_rate: 0.001
  - type: custom
    name: siem-collector
    host: siem-collector-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 25
      error_rate: 0.001
      custom_type: siem-collector-events
connections:
  - source: entra-oauth-broker
    target: ms-graph-egress
    protocol: https
    port: 443
  - source: entra-oauth-broker
    target: audit-events-db
    protocol: tcp
    port: 5432
  - source: ms-graph-egress
    target: exchange-online
    protocol: https
    port: 443
  - source: entra-oauth-broker
    target: siem-collector
    protocol: tcp
    port: 9200
  - source: ms-graph-egress
    target: siem-collector
    protocol: tcp
    port: 9200
custom_types:
  - id: ms-graph-egress-events
    name: ms-graph-egress
    description: Generic event log for ms-graph-egress
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - ms-graph-egress request received
          - ms-graph-egress processed event
          - ms-graph-egress returned response
    templates:
      - id: info
        template: '{{timestamp}} ms-graph-egress [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} ms-graph-egress [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: exchange-online-events
    name: exchange-online
    description: Generic event log for exchange-online
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - exchange-online request received
          - exchange-online processed event
          - exchange-online returned response
    templates:
      - id: info
        template: '{{timestamp}} exchange-online [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} exchange-online [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: siem-collector-events
    name: siem-collector
    description: Generic event log for siem-collector
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - siem-collector request received
          - siem-collector processed event
          - siem-collector returned response
    templates:
      - id: info
        template: '{{timestamp}} siem-collector [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} siem-collector [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
