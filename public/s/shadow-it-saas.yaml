name: Shadow IT — Unsanctioned SaaS Wired Into Corp SSO
description: >-
  An eager team lead spins up a free Notion workspace, enables 'sign in with Microsoft', and starts inviting external
  contractors. Three weeks later 142 corp users are signed in, internal customer notes are pasted in, and security has
  no idea.
duration: 1800
tick_interval_ms: 1000
nodes:
  - type: vpc
    name: corp-identity-egress
    provider: aws
    region: us-east-1
    cidr_block: 10.0.0.0/16
  - type: subnet
    name: identity-edge
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: saas-bridge
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: casb-store
    cidr_block: 10.0.1.0/24
  - type: virtual_server
    name: entra-oauth-broker-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: identity-edge
  - type: virtual_server
    name: ms-defender-casb-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: saas-bridge
  - type: virtual_server
    name: notion-so-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: saas-bridge
  - type: virtual_server
    name: casb-events-db-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: casb-store
services:
  - type: nginx
    name: entra-oauth-broker
    host: entra-oauth-broker-host
    generator:
      type: nginx
      port: 80
      log_format: combined
      traffic_rate: 50
  - type: custom
    name: ms-defender-casb
    host: ms-defender-casb-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 30
      error_rate: 0.005
      custom_type: ms-defender-casb-events
    timeline:
      - from: 0
        to: 1020
        state: healthy
      - from: 1020
        to: 1260
        state: degraded
        note: alert backlog
      - from: 1260
        to: 1800
        state: healthy
  - type: custom
    name: notion-so
    description: Unsanctioned external SaaS.
    host: notion-so-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 25
      error_rate: 0.005
      custom_type: notion-so-events
    timeline:
      - from: 0
        to: 240
        state: healthy
      - from: 240
        to: 1260
        state: degraded
        note: unsanctioned growth
      - from: 1260
        to: 1800
        state: recovering
        note: moving to enterprise plan
  - type: postgres
    name: casb-events-db
    host: casb-events-db-host
    generator:
      type: postgres
      port: 5432
      slow_query_threshold: 1000
      traffic_rate: 12
      error_rate: 0.001
connections:
  - source: entra-oauth-broker
    target: notion-so
    protocol: https
    port: 443
  - source: entra-oauth-broker
    target: ms-defender-casb
    protocol: https
    port: 443
  - source: ms-defender-casb
    target: casb-events-db
    protocol: tcp
    port: 5432
custom_types:
  - id: ms-defender-casb-events
    name: ms-defender-casb
    description: Generic event log for ms-defender-casb
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - ms-defender-casb request received
          - ms-defender-casb processed event
          - ms-defender-casb returned response
    templates:
      - id: info
        template: '{{timestamp}} ms-defender-casb [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} ms-defender-casb [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: notion-so-events
    name: notion-so
    description: Generic event log for notion-so
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - notion-so request received
          - notion-so processed event
          - notion-so returned response
    templates:
      - id: info
        template: '{{timestamp}} notion-so [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} notion-so [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
