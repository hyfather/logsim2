name: Subdomain Takeover via Dangling CNAME
description: >-
  shop-old.acme.io still has a CNAME to a Heroku app that was deleted in 2021. An attacker registers the same Heroku app
  name, claims the dangling pointer, and starts serving a near-perfect phishing clone of the login page on a
  trusted-looking acme.io subdomain.
duration: 1620
tick_interval_ms: 1000
nodes:
  - type: vpc
    name: consumer-prod
    provider: aws
    region: us-east-1
    cidr_block: 10.0.0.0/16
  - type: subnet
    name: consumer-edge
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: consumer-app
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: consumer-data
    cidr_block: 10.0.1.0/24
  - type: virtual_server
    name: shop-edge-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-edge
  - type: virtual_server
    name: shop-old.acme.io-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-edge
  - type: virtual_server
    name: shop-api-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-app
  - type: virtual_server
    name: auth-svc-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-app
  - type: virtual_server
    name: shop-db-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-data
services:
  - type: nginx
    name: shop-edge
    host: shop-edge-host
    generator:
      type: nginx
      port: 80
      log_format: combined
      traffic_rate: 50
  - type: nginx
    name: shop-old.acme.io
    description: Heroku CNAME — now attacker-controlled.
    host: shop-old.acme.io-host
    generator:
      type: nginx
      port: 80
      log_format: combined
      traffic_rate: 50
    timeline:
      - from: 0
        to: 240
        state: healthy
        note: abandoned, harmless
      - from: 240
        to: 360
        state: under_attack
        note: claimed by attacker
      - from: 360
        to: 1140
        state: compromised
        note: phishing site live
      - from: 1140
        to: 1620
        state: down
        note: CNAME removed
  - type: nodejs
    name: shop-api
    host: shop-api-host
    generator:
      type: nodejs
      port: 3000
      log_format: json
      log_level: info
      traffic_rate: 110
      error_rate: 0.005
      endpoints:
        - method: GET
          path: /api/health
          avg_latency_ms: 20
          error_rate: 0.001
        - method: GET
          path: /api/users
          avg_latency_ms: 100
          error_rate: 0.01
        - method: POST
          path: /api/users
          avg_latency_ms: 220
          error_rate: 0.01
    timeline:
      - from: 0
        to: 1620
        state: healthy
  - type: nodejs
    name: auth-svc
    host: auth-svc-host
    generator:
      type: nodejs
      port: 3000
      log_format: json
      log_level: info
      traffic_rate: 50
      error_rate: 0.005
      endpoints:
        - method: GET
          path: /api/health
          avg_latency_ms: 20
          error_rate: 0.001
        - method: GET
          path: /api/users
          avg_latency_ms: 100
          error_rate: 0.01
        - method: POST
          path: /api/users
          avg_latency_ms: 220
          error_rate: 0.01
    timeline:
      - from: 0
        to: 780
        state: healthy
      - from: 780
        to: 1140
        state: under_attack
        note: credential reuse from harvested set
      - from: 1140
        to: 1620
        state: recovering
  - type: postgres
    name: shop-db
    host: shop-db-host
    generator:
      type: postgres
      port: 5432
      slow_query_threshold: 1000
      traffic_rate: 80
      error_rate: 0.001
connections:
  - source: shop-edge
    target: shop-api
    protocol: https
    port: 443
  - source: shop-edge
    target: auth-svc
    protocol: https
    port: 443
  - source: shop-api
    target: shop-db
    protocol: tcp
    port: 5432
  - source: auth-svc
    target: shop-db
    protocol: tcp
    port: 5432
