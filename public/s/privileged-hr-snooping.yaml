name: HR Analyst Snooping on Exec Files
description: >-
  Workday integration role gives one HR analyst broad read access to compensation files. Late on a Sunday they open 27
  C-suite documents in 14 minutes, pull comp histories, then save them to a personal OneDrive folder.
duration: 1080
tick_interval_ms: 1000
nodes:
  - type: vpc
    name: people-systems
    provider: aws
    region: us-east-1
    cidr_block: 10.0.0.0/16
  - type: subnet
    name: people-edge
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: people-app
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: people-data
    cidr_block: 10.0.1.0/24
  - type: virtual_server
    name: workday-sso-edge-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: people-edge
  - type: virtual_server
    name: workday-hris-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: people-app
  - type: virtual_server
    name: onedrive-corp-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: people-app
  - type: virtual_server
    name: siem-collector-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: people-data
services:
  - type: nginx
    name: workday-sso-edge
    host: workday-sso-edge-host
    generator:
      type: nginx
      port: 80
      log_format: combined
      traffic_rate: 50
  - type: custom
    name: workday-hris
    host: workday-hris-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 25
      error_rate: 0.005
      custom_type: workday-hris-events
    timeline:
      - from: 0
        to: 360
        state: healthy
      - from: 360
        to: 720
        state: under_attack
        note: anomalous executive-record reads
      - from: 720
        to: 1080
        state: recovering
  - type: custom
    name: onedrive-corp
    host: onedrive-corp-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 35
      error_rate: 0.005
      custom_type: onedrive-corp-events
    timeline:
      - from: 0
        to: 540
        state: healthy
      - from: 540
        to: 720
        state: compromised
        note: off-policy document copy
      - from: 720
        to: 1080
        state: recovering
  - type: custom
    name: siem-collector
    host: siem-collector-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 20
      error_rate: 0.001
      custom_type: siem-collector-events
connections:
  - source: workday-sso-edge
    target: workday-hris
    protocol: https
    port: 443
  - source: workday-sso-edge
    target: onedrive-corp
    protocol: https
    port: 443
  - source: workday-hris
    target: siem-collector
    protocol: tcp
    port: 9200
  - source: onedrive-corp
    target: siem-collector
    protocol: tcp
    port: 9200
custom_types:
  - id: workday-hris-events
    name: workday-hris
    description: Generic event log for workday-hris
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - workday-hris request received
          - workday-hris processed event
          - workday-hris returned response
    templates:
      - id: info
        template: '{{timestamp}} workday-hris [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} workday-hris [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: onedrive-corp-events
    name: onedrive-corp
    description: Generic event log for onedrive-corp
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - onedrive-corp request received
          - onedrive-corp processed event
          - onedrive-corp returned response
    templates:
      - id: info
        template: '{{timestamp}} onedrive-corp [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} onedrive-corp [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: siem-collector-events
    name: siem-collector
    description: Generic event log for siem-collector
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - siem-collector request received
          - siem-collector processed event
          - siem-collector returned response
    templates:
      - id: info
        template: '{{timestamp}} siem-collector [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} siem-collector [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
