name: DNS Cutover With Bad TTL
description: >-
  Cutover from old-edge.acme.io (Apache) to new-edge.acme.io (Envoy) was supposed to be instant. The old A record had a
  24-hour TTL set during a 2019 migration that nobody changed. After cutover, half the user base happily slams the old,
  decommissioned edge for hours.
duration: 1620
tick_interval_ms: 1000
nodes:
  - type: vpc
    name: consumer-prod
    provider: aws
    region: us-east-1
    cidr_block: 10.0.0.0/16
  - type: subnet
    name: consumer-edge
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: consumer-app
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: consumer-data
    cidr_block: 10.0.1.0/24
  - type: virtual_server
    name: old-edge-apache-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-edge
  - type: virtual_server
    name: new-edge-envoy-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-edge
  - type: virtual_server
    name: consumer-api-1-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-app
  - type: virtual_server
    name: consumer-api-2-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-app
  - type: virtual_server
    name: consumer-db-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-data
services:
  - type: nginx
    name: old-edge-apache
    description: Decommissioned. Upstream pool empty after cutover.
    host: old-edge-apache-host
    generator:
      type: nginx
      port: 80
      log_format: combined
      traffic_rate: 50
    timeline:
      - from: 0
        to: 180
        state: healthy
      - from: 180
        to: 660
        state: down
        note: no upstream after cutover
      - from: 660
        to: 1320
        state: recovering
        note: stopgap pool re-added
      - from: 1320
        to: 1620
        state: healthy
  - type: nginx
    name: new-edge-envoy
    host: new-edge-envoy-host
    generator:
      type: nginx
      port: 80
      log_format: combined
      traffic_rate: 50
    timeline:
      - from: 0
        to: 1620
        state: healthy
  - type: nodejs
    name: consumer-api-1
    host: consumer-api-1-host
    generator:
      type: nodejs
      port: 3000
      log_format: json
      log_level: info
      traffic_rate: 60
      error_rate: 0.005
      endpoints:
        - method: GET
          path: /api/health
          avg_latency_ms: 20
          error_rate: 0.001
        - method: GET
          path: /api/users
          avg_latency_ms: 100
          error_rate: 0.01
        - method: POST
          path: /api/users
          avg_latency_ms: 220
          error_rate: 0.01
    timeline:
      - from: 0
        to: 1620
        state: healthy
  - type: nodejs
    name: consumer-api-2
    host: consumer-api-2-host
    generator:
      type: nodejs
      port: 3000
      log_format: json
      log_level: info
      traffic_rate: 60
      error_rate: 0.005
      endpoints:
        - method: GET
          path: /api/health
          avg_latency_ms: 20
          error_rate: 0.001
        - method: GET
          path: /api/users
          avg_latency_ms: 100
          error_rate: 0.01
        - method: POST
          path: /api/users
          avg_latency_ms: 220
          error_rate: 0.01
    timeline:
      - from: 0
        to: 1620
        state: healthy
  - type: postgres
    name: consumer-db
    host: consumer-db-host
    generator:
      type: postgres
      port: 5432
      slow_query_threshold: 1000
      traffic_rate: 50
      error_rate: 0.001
connections:
  - source: new-edge-envoy
    target: consumer-api-1
    protocol: http
    port: 3000
  - source: new-edge-envoy
    target: consumer-api-2
    protocol: http
    port: 3000
  - source: consumer-api-1
    target: consumer-db
    protocol: tcp
    port: 5432
  - source: consumer-api-2
    target: consumer-db
    protocol: tcp
    port: 5432
