name: Online Schema Migration Deadlock
description: >-
  An ALTER TABLE on the orders table runs as part of a deploy. It's supposed to be online, but a long-held SELECT FOR
  UPDATE from a stale connection blocks it. The migration acquires a metadata lock, every subsequent INSERT waits for
  the migration, and the API queues fill up.
duration: 1200
tick_interval_ms: 1000
nodes:
  - type: vpc
    name: orders-prod-vpc
    provider: aws
    region: us-east-1
    cidr_block: 10.0.0.0/16
  - type: subnet
    name: orders-edge
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: orders-app
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: orders-data
    cidr_block: 10.0.1.0/24
  - type: virtual_server
    name: orders-edge-lb-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: orders-edge
  - type: virtual_server
    name: orders-api-1-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: orders-app
  - type: virtual_server
    name: orders-api-2-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: orders-app
  - type: virtual_server
    name: schema-migrator-job-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: orders-app
  - type: virtual_server
    name: orders-db-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: orders-data
services:
  - type: nginx
    name: orders-edge-lb
    host: orders-edge-lb-host
    generator:
      type: nginx
      port: 80
      log_format: combined
      traffic_rate: 50
  - type: nodejs
    name: orders-api-1
    host: orders-api-1-host
    generator:
      type: nodejs
      port: 3000
      log_format: json
      log_level: info
      traffic_rate: 60
      error_rate: 0.005
      endpoints:
        - method: GET
          path: /api/health
          avg_latency_ms: 20
          error_rate: 0.001
        - method: GET
          path: /api/users
          avg_latency_ms: 100
          error_rate: 0.01
        - method: POST
          path: /api/users
          avg_latency_ms: 220
          error_rate: 0.01
    timeline:
      - from: 0
        to: 240
        state: healthy
      - from: 240
        to: 600
        state: degraded
        note: pool saturated
      - from: 600
        to: 840
        state: recovering
      - from: 840
        to: 1200
        state: healthy
  - type: nodejs
    name: orders-api-2
    host: orders-api-2-host
    generator:
      type: nodejs
      port: 3000
      log_format: json
      log_level: info
      traffic_rate: 60
      error_rate: 0.005
      endpoints:
        - method: GET
          path: /api/health
          avg_latency_ms: 20
          error_rate: 0.001
        - method: GET
          path: /api/users
          avg_latency_ms: 100
          error_rate: 0.01
        - method: POST
          path: /api/users
          avg_latency_ms: 220
          error_rate: 0.01
    timeline:
      - from: 0
        to: 240
        state: healthy
      - from: 240
        to: 600
        state: degraded
      - from: 600
        to: 840
        state: recovering
      - from: 840
        to: 1200
        state: healthy
  - type: custom
    name: schema-migrator-job
    description: Runs flyway via a one-shot K8s job during deploy.
    host: schema-migrator-job-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 5
      custom_type: schema-migrator-job-events
    timeline:
      - from: 0
        to: 180
        state: healthy
      - from: 180
        to: 540
        state: down
        note: blocked on metadata lock
      - from: 540
        to: 600
        state: recovering
      - from: 600
        to: 1200
        state: healthy
  - type: mysql
    name: orders-db
    host: orders-db-host
    generator:
      type: mysql
      port: 3306
      slow_query_threshold: 1000
      traffic_rate: 66
      error_rate: 0.0023
    timeline:
      - from: 0
        to: 180
        state: healthy
      - from: 180
        to: 540
        state: down
        note: metadata lock standoff
      - from: 540
        to: 780
        state: recovering
      - from: 780
        to: 1200
        state: healthy
connections:
  - source: orders-edge-lb
    target: orders-api-1
    protocol: http
    port: 3000
  - source: orders-edge-lb
    target: orders-api-2
    protocol: http
    port: 3000
  - source: orders-api-1
    target: orders-db
    protocol: tcp
    port: 3306
  - source: orders-api-2
    target: orders-db
    protocol: tcp
    port: 3306
  - source: schema-migrator-job
    target: orders-db
    protocol: tcp
    port: 3306
custom_types:
  - id: schema-migrator-job-events
    name: schema-migrator-job
    description: Generic event log for schema-migrator-job
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - schema-migrator-job request received
          - schema-migrator-job processed event
          - schema-migrator-job returned response
    templates:
      - id: info
        template: '{{timestamp}} schema-migrator-job [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} schema-migrator-job [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
