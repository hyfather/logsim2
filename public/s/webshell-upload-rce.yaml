name: Web Shell Drop via Image Uploader
description: >-
  A poorly written profile-photo uploader trusts the client-supplied Content-Type and writes the file under the public
  webroot. An attacker uploads a polyglot .jpg/.phtml, hits its URL, and gets RCE inside the user-uploads container.
duration: 1500
tick_interval_ms: 1000
nodes:
  - type: vpc
    name: consumer-prod-vpc
    provider: aws
    region: us-east-1
    cidr_block: 10.0.0.0/16
  - type: subnet
    name: consumer-edge
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: consumer-app
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: consumer-data
    cidr_block: 10.0.1.0/24
  - type: virtual_server
    name: edge-cdn-origin-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-edge
  - type: virtual_server
    name: profile-api-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-app
  - type: virtual_server
    name: user-uploads-svc-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-app
  - type: virtual_server
    name: static-assets-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-app
  - type: virtual_server
    name: users-db-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-data
  - type: virtual_server
    name: minio-blobs-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: consumer-data
services:
  - type: nginx
    name: edge-cdn-origin
    host: edge-cdn-origin-host
    generator:
      type: nginx
      port: 80
      log_format: combined
      traffic_rate: 50
  - type: nodejs
    name: profile-api
    host: profile-api-host
    generator:
      type: nodejs
      port: 3000
      log_format: json
      log_level: info
      traffic_rate: 90
      error_rate: 0.005
      endpoints:
        - method: GET
          path: /api/health
          avg_latency_ms: 20
          error_rate: 0.001
        - method: GET
          path: /api/users
          avg_latency_ms: 100
          error_rate: 0.01
        - method: POST
          path: /api/users
          avg_latency_ms: 220
          error_rate: 0.01
    timeline:
      - from: 0
        to: 1500
        state: healthy
  - type: nodejs
    name: user-uploads-svc
    description: Trusts Content-Type from the client.
    host: user-uploads-svc-host
    generator:
      type: nodejs
      port: 3000
      log_format: json
      log_level: info
      traffic_rate: 30
      error_rate: 0.01
      endpoints:
        - method: GET
          path: /api/health
          avg_latency_ms: 20
          error_rate: 0.001
        - method: GET
          path: /api/users
          avg_latency_ms: 100
          error_rate: 0.01
        - method: POST
          path: /api/users
          avg_latency_ms: 220
          error_rate: 0.01
    timeline:
      - from: 0
        to: 240
        state: healthy
      - from: 240
        to: 480
        state: under_attack
        note: polyglot uploads accepted
      - from: 480
        to: 1020
        state: compromised
        note: RCE via static-assets passthrough
      - from: 1020
        to: 1260
        state: recovering
        note: allow-list rolled out
      - from: 1260
        to: 1500
        state: healthy
  - type: nginx
    name: static-assets
    description: Serves /uploads/* via PHP-FPM passthrough (legacy).
    host: static-assets-host
    generator:
      type: nginx
      port: 80
      log_format: combined
      traffic_rate: 50
      error_rate: 0.003
    timeline:
      - from: 0
        to: 360
        state: healthy
      - from: 360
        to: 1020
        state: compromised
        note: executing user-uploaded code
      - from: 1020
        to: 1260
        state: recovering
      - from: 1260
        to: 1500
        state: healthy
  - type: postgres
    name: users-db
    host: users-db-host
    generator:
      type: postgres
      port: 5432
      slow_query_threshold: 1000
      traffic_rate: 40
      error_rate: 0.001
    timeline:
      - from: 0
        to: 660
        state: healthy
      - from: 660
        to: 1020
        state: under_attack
        note: anomalous reads via shell
      - from: 1020
        to: 1500
        state: healthy
  - type: custom
    name: minio-blobs
    host: minio-blobs-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 20
      error_rate: 0.002
      custom_type: minio-blobs-events
connections:
  - source: edge-cdn-origin
    target: profile-api
    protocol: https
    port: 443
  - source: edge-cdn-origin
    target: user-uploads-svc
    protocol: https
    port: 443
  - source: edge-cdn-origin
    target: static-assets
    protocol: https
    port: 443
  - source: profile-api
    target: users-db
    protocol: tcp
    port: 5432
  - source: user-uploads-svc
    target: minio-blobs
    protocol: http
    port: 9000
custom_types:
  - id: minio-blobs-events
    name: minio-blobs
    description: Generic event log for minio-blobs
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - minio-blobs request received
          - minio-blobs processed event
          - minio-blobs returned response
    templates:
      - id: info
        template: '{{timestamp}} minio-blobs [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} minio-blobs [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
