name: GitHub Actions OIDC Trust Too Loose
description: >-
  The IAM role for prod deploys trusts the GitHub OIDC provider with `repo:acme/*` instead of a specific repo + branch.
  An attacker forks a tiny repo, adds a workflow that requests an OIDC token, and assumes the prod role from their
  fork's PR runner.
duration: 1500
tick_interval_ms: 1000
nodes:
  - type: vpc
    name: scm-and-cloud-mirror
    provider: aws
    region: us-east-1
    cidr_block: 10.0.0.0/16
  - type: subnet
    name: scm-edge
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: control-plane-app
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: audit-store
    cidr_block: 10.0.1.0/24
  - type: virtual_server
    name: github-edge-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: scm-edge
  - type: virtual_server
    name: actions-runner-pool-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: control-plane-app
  - type: virtual_server
    name: aws-iam-sts-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: control-plane-app
  - type: virtual_server
    name: aws-ec2-control-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: control-plane-app
  - type: virtual_server
    name: cloudtrail-firehose-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: audit-store
  - type: virtual_server
    name: siem-collector-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: audit-store
services:
  - type: nginx
    name: github-edge
    host: github-edge-host
    generator:
      type: nginx
      port: 80
      log_format: combined
      traffic_rate: 50
  - type: custom
    name: actions-runner-pool
    host: actions-runner-pool-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 30
      error_rate: 0.005
      custom_type: actions-runner-pool-events
    timeline:
      - from: 0
        to: 240
        state: healthy
      - from: 240
        to: 480
        state: under_attack
        note: fork runner abusing OIDC
      - from: 480
        to: 1020
        state: compromised
        note: running with prod role creds
      - from: 1020
        to: 1500
        state: healthy
  - type: custom
    name: aws-iam-sts
    host: aws-iam-sts-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 10
      error_rate: 0.005
      custom_type: aws-iam-sts-events
    timeline:
      - from: 0
        to: 480
        state: healthy
      - from: 480
        to: 1020
        state: compromised
        note: AssumeRoleWithWebIdentity from fork
      - from: 1020
        to: 1260
        state: recovering
      - from: 1260
        to: 1500
        state: healthy
  - type: custom
    name: aws-ec2-control
    host: aws-ec2-control-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 8
      error_rate: 0.005
      custom_type: aws-ec2-control-events
    timeline:
      - from: 0
        to: 660
        state: healthy
      - from: 660
        to: 1020
        state: under_attack
      - from: 1020
        to: 1500
        state: healthy
  - type: custom
    name: cloudtrail-firehose
    host: cloudtrail-firehose-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 12
      error_rate: 0.001
      custom_type: cloudtrail-firehose-events
  - type: custom
    name: siem-collector
    host: siem-collector-host
    generator:
      type: custom
      port: 8080
      traffic_rate: 18
      error_rate: 0.001
      custom_type: siem-collector-events
connections:
  - source: github-edge
    target: actions-runner-pool
    protocol: https
    port: 443
  - source: actions-runner-pool
    target: aws-iam-sts
    protocol: https
    port: 443
  - source: aws-iam-sts
    target: aws-ec2-control
    protocol: https
    port: 443
  - source: aws-ec2-control
    target: cloudtrail-firehose
    protocol: https
    port: 443
  - source: cloudtrail-firehose
    target: siem-collector
    protocol: tcp
    port: 9200
custom_types:
  - id: actions-runner-pool-events
    name: actions-runner-pool
    description: Generic event log for actions-runner-pool
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - actions-runner-pool request received
          - actions-runner-pool processed event
          - actions-runner-pool returned response
    templates:
      - id: info
        template: '{{timestamp}} actions-runner-pool [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} actions-runner-pool [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: aws-iam-sts-events
    name: aws-iam-sts
    description: Generic event log for aws-iam-sts
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - aws-iam-sts request received
          - aws-iam-sts processed event
          - aws-iam-sts returned response
    templates:
      - id: info
        template: '{{timestamp}} aws-iam-sts [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} aws-iam-sts [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: aws-ec2-control-events
    name: aws-ec2-control
    description: Generic event log for aws-ec2-control
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - aws-ec2-control request received
          - aws-ec2-control processed event
          - aws-ec2-control returned response
    templates:
      - id: info
        template: '{{timestamp}} aws-ec2-control [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} aws-ec2-control [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: cloudtrail-firehose-events
    name: cloudtrail-firehose
    description: Generic event log for cloudtrail-firehose
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - cloudtrail-firehose request received
          - cloudtrail-firehose processed event
          - cloudtrail-firehose returned response
    templates:
      - id: info
        template: '{{timestamp}} cloudtrail-firehose [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} cloudtrail-firehose [ERROR] request failed unexpectedly'
        weight: 0.05
        level: error
        is_error: true
  - id: siem-collector-events
    name: siem-collector
    description: Generic event log for siem-collector
    default_port: 8080
    default_rate: 5
    placeholders:
      timestamp:
        kind: iso_timestamp
      level:
        kind: level
      message:
        kind: enum
        enum_values:
          - siem-collector request received
          - siem-collector processed event
          - siem-collector returned response
    templates:
      - id: info
        template: '{{timestamp}} siem-collector [{{level}}] {{message}}'
        weight: 0.95
        level: info
      - id: error
        template: '{{timestamp}} siem-collector [ERROR] request failed unexpectedly'
        weight: 0.05
