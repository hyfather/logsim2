name: Bad Canary Deploy
description: >-
  A canary deploy on api-1 fails health checks, the load balancer shifts traffic to the remaining instances, they
  degrade under the extra load until a rollback restores the fleet.
duration: 1080
tick_interval_ms: 1000
nodes:
  - type: vpc
    name: prod-vpc
    provider: aws
    region: us-east-1
    cidr_block: 10.0.0.0/16
  - type: subnet
    name: public-subnet
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: app-subnet
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: data-subnet
    cidr_block: 10.0.1.0/24
  - type: virtual_server
    name: edge-lb-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: public-subnet
  - type: virtual_server
    name: api-1-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: app-subnet
  - type: virtual_server
    name: api-2-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: app-subnet
  - type: virtual_server
    name: api-3-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: app-subnet
  - type: virtual_server
    name: app-db-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: data-subnet
services:
  - type: nginx
    name: edge-lb
    description: Active health-check pool.
    host: edge-lb-host
    generator:
      type: nginx
      port: 80
      log_format: combined
      traffic_rate: 50
  - type: nodejs
    name: api-1
    description: Canary target.
    host: api-1-host
    generator:
      type: nodejs
      port: 3000
      log_format: json
      log_level: info
      traffic_rate: 60
      error_rate: 0.005
      endpoints:
        - method: GET
          path: /api/health
          avg_latency_ms: 20
          error_rate: 0.001
        - method: GET
          path: /api/users
          avg_latency_ms: 100
          error_rate: 0.01
        - method: POST
          path: /api/users
          avg_latency_ms: 220
          error_rate: 0.01
    timeline:
      - from: 0
        to: 240
        state: healthy
      - from: 240
        to: 720
        state: down
        note: bad deploy 5xx
      - from: 720
        to: 900
        state: recovering
        note: rollback warm-up
      - from: 900
        to: 1080
        state: healthy
  - type: nodejs
    name: api-2
    host: api-2-host
    generator:
      type: nodejs
      port: 3000
      log_format: json
      log_level: info
      traffic_rate: 60
      error_rate: 0.005
      endpoints:
        - method: GET
          path: /api/health
          avg_latency_ms: 20
          error_rate: 0.001
        - method: GET
          path: /api/users
          avg_latency_ms: 100
          error_rate: 0.01
        - method: POST
          path: /api/users
          avg_latency_ms: 220
          error_rate: 0.01
    timeline:
      - from: 0
        to: 360
        state: healthy
      - from: 360
        to: 720
        state: degraded
        note: absorbing failed-over load
      - from: 720
        to: 900
        state: recovering
      - from: 900
        to: 1080
        state: healthy
  - type: nodejs
    name: api-3
    host: api-3-host
    generator:
      type: nodejs
      port: 3000
      log_format: json
      log_level: info
      traffic_rate: 60
      error_rate: 0.005
      endpoints:
        - method: GET
          path: /api/health
          avg_latency_ms: 20
          error_rate: 0.001
        - method: GET
          path: /api/users
          avg_latency_ms: 100
          error_rate: 0.01
        - method: POST
          path: /api/users
          avg_latency_ms: 220
          error_rate: 0.01
    timeline:
      - from: 0
        to: 360
        state: healthy
      - from: 360
        to: 720
        state: degraded
        note: absorbing failed-over load
      - from: 720
        to: 900
        state: recovering
      - from: 900
        to: 1080
        state: healthy
  - type: postgres
    name: app-db
    host: app-db-host
    generator:
      type: postgres
      port: 5432
      slow_query_threshold: 1000
      traffic_rate: 90
      error_rate: 0.001
connections:
  - source: edge-lb
    target: api-1
    protocol: http
    port: 3000
  - source: edge-lb
    target: api-2
    protocol: http
    port: 3000
  - source: edge-lb
    target: api-3
    protocol: http
    port: 3000
  - source: api-1
    target: app-db
    protocol: tcp
    port: 5432
  - source: api-2
    target: app-db
    protocol: tcp
    port: 5432
  - source: api-3
    target: app-db
    protocol: tcp
    port: 5432
