name: Credential Stuffing → Account Takeover
description: >-
  Distributed credential stuffing pounds the auth API. Many failed logins eventually break through; an attacker gets a
  foothold in users-api, lateral movement begins, then the breach is contained.
duration: 1500
tick_interval_ms: 1000
nodes:
  - type: vpc
    name: prod-vpc
    provider: aws
    region: us-east-1
    cidr_block: 10.0.0.0/16
  - type: subnet
    name: public-subnet
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: app-subnet
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: data-subnet
    cidr_block: 10.0.1.0/24
  - type: virtual_server
    name: edge-lb-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: public-subnet
  - type: virtual_server
    name: auth-api-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: app-subnet
  - type: virtual_server
    name: users-api-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: app-subnet
  - type: virtual_server
    name: auth-db-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: data-subnet
  - type: virtual_server
    name: session-cache-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: data-subnet
services:
  - type: nginx
    name: edge-lb
    host: edge-lb-host
    generator:
      type: nginx
      port: 80
      log_format: combined
      traffic_rate: 50
  - type: nodejs
    name: auth-api
    description: Login + session issuance.
    host: auth-api-host
    generator:
      type: nodejs
      port: 3000
      log_format: json
      log_level: info
      traffic_rate: 50
      error_rate: 0.02
      endpoints:
        - method: GET
          path: /api/health
          avg_latency_ms: 20
          error_rate: 0.001
        - method: GET
          path: /api/users
          avg_latency_ms: 100
          error_rate: 0.01
        - method: POST
          path: /api/users
          avg_latency_ms: 220
          error_rate: 0.01
    timeline:
      - from: 0
        to: 240
        state: healthy
      - from: 240
        to: 540
        state: under_attack
        note: credential stuffing
      - from: 540
        to: 780
        state: throttled
        note: rate limit engaged
      - from: 780
        to: 1140
        state: compromised
        note: successful brute force
      - from: 1140
        to: 1500
        state: recovering
  - type: nodejs
    name: users-api
    description: Account profile + PII.
    host: users-api-host
    generator:
      type: nodejs
      port: 3000
      log_format: json
      log_level: info
      traffic_rate: 80
      error_rate: 0.005
      endpoints:
        - method: GET
          path: /api/health
          avg_latency_ms: 20
          error_rate: 0.001
        - method: GET
          path: /api/users
          avg_latency_ms: 100
          error_rate: 0.01
        - method: POST
          path: /api/users
          avg_latency_ms: 220
          error_rate: 0.01
    timeline:
      - from: 0
        to: 840
        state: healthy
      - from: 840
        to: 1140
        state: compromised
        note: session hijack lateral movement
      - from: 1140
        to: 1500
        state: recovering
  - type: postgres
    name: auth-db
    host: auth-db-host
    generator:
      type: postgres
      port: 5432
      slow_query_threshold: 1000
      traffic_rate: 80
      error_rate: 0.001
    timeline:
      - from: 0
        to: 1020
        state: healthy
      - from: 1020
        to: 1140
        state: under_attack
        note: anomalous bulk reads
      - from: 1140
        to: 1500
        state: healthy
  - type: redis
    name: session-cache
    host: session-cache-host
    generator:
      type: redis
      port: 6379
      max_memory: 256mb
      eviction_policy: allkeys-lru
      traffic_rate: 250
      error_rate: 0.0005
connections:
  - source: edge-lb
    target: auth-api
    protocol: http
    port: 3000
  - source: edge-lb
    target: users-api
    protocol: http
    port: 3000
  - source: auth-api
    target: auth-db
    protocol: tcp
    port: 5432
  - source: users-api
    target: auth-db
    protocol: tcp
    port: 5432
  - source: auth-api
    target: session-cache
    protocol: tcp
    port: 6379
  - source: users-api
    target: session-cache
    protocol: tcp
    port: 6379
