name: Feature Flag Flip Storms Downstream
description: >-
  PM toggles a single LaunchDarkly flag from 5% to 100% on the new search-personalization path. The new path makes 4
  extra Postgres queries per request. p95 latency on search-svc holds, but the database CPU pegs at 95% and unrelated
  services start timing out.
duration: 1080
tick_interval_ms: 1000
nodes:
  - type: vpc
    name: platform-prod-vpc
    provider: aws
    region: us-east-1
    cidr_block: 10.0.0.0/16
  - type: subnet
    name: platform-edge
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: platform-app
    cidr_block: 10.0.1.0/24
  - type: subnet
    name: platform-data
    cidr_block: 10.0.1.0/24
  - type: virtual_server
    name: edge-lb-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: platform-edge
  - type: virtual_server
    name: search-svc-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: platform-app
  - type: virtual_server
    name: billing-svc-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: platform-app
  - type: virtual_server
    name: shared-pg-host
    instance_type: t3.medium
    os: ubuntu-22.04
    subnet: platform-data
services:
  - type: nginx
    name: edge-lb
    host: edge-lb-host
    generator:
      type: nginx
      port: 80
      log_format: combined
      traffic_rate: 50
  - type: golang
    name: search-svc
    host: search-svc-host
    generator:
      type: golang
      port: 8080
      log_format: json
      log_level: info
      traffic_rate: 80
      error_rate: 0.005
      endpoints:
        - method: GET
          path: /healthz
          avg_latency_ms: 8
          error_rate: 0.001
        - method: GET
          path: /api/v1/items
          avg_latency_ms: 80
          error_rate: 0.005
    timeline:
      - from: 0
        to: 240
        state: healthy
      - from: 240
        to: 780
        state: degraded
        note: ramped query rate, latency edge
      - from: 780
        to: 1080
        state: healthy
  - type: golang
    name: billing-svc
    description: Shares the same Postgres.
    host: billing-svc-host
    generator:
      type: golang
      port: 8080
      log_format: json
      log_level: info
      traffic_rate: 30
      error_rate: 0.005
      endpoints:
        - method: GET
          path: /healthz
          avg_latency_ms: 8
          error_rate: 0.001
        - method: GET
          path: /api/v1/items
          avg_latency_ms: 80
          error_rate: 0.005
    timeline:
      - from: 0
        to: 420
        state: healthy
      - from: 420
        to: 780
        state: degraded
        note: noisy-neighbour DB
      - from: 780
        to: 1080
        state: healthy
  - type: postgres
    name: shared-pg
    host: shared-pg-host
    generator:
      type: postgres
      port: 5432
      slow_query_threshold: 1000
      traffic_rate: 65
      error_rate: 0.001
    timeline:
      - from: 0
        to: 240
        state: healthy
      - from: 240
        to: 780
        state: under_attack
        note: CPU 95%, queue building
      - from: 780
        to: 1080
        state: healthy
connections:
  - source: edge-lb
    target: search-svc
    protocol: http
    port: 8080
  - source: edge-lb
    target: billing-svc
    protocol: http
    port: 8080
  - source: search-svc
    target: shared-pg
    protocol: tcp
    port: 5432
  - source: billing-svc
    target: shared-pg
    protocol: tcp
    port: 5432
